name: Compilar C++ a WebAssembly on: push: branches: [ "feature/wasm-compile", "main" ] jobs: build: runs-on: ubuntu-latest steps: - name: Descargar repositorio uses: actions/checkout@v3 - name: Configurar Emscripten (emcc) uses: mymindstorm/setup-emsdk@v12 - name: Compilar C++ a WebAssembly run: | emcc core.cpp -o core.js -s EXPORTED\_RUNTIME\_METHODS='["ccall","cwrap"]' -s NO\_EXIT\_RUNTIME=1 - name: Guardar binarios compilados uses: actions/upload-artifact@v3 with: name: wasm-binaries path: | core.js core.wasm
