name: Compilar C++ a WebAssembly

on:
  push:
    branches: [ "feature/wasm-compile", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Emscripten (emcc)
      uses: mymindstorm/setup-emsdk@v14

    - name: Compilar C++ a WebAssembly
      run: |
        em++ core.cpp -o core.js -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' -s NO_EXIT_RUNTIME=1

    - name: Guardar binarios compilados
      uses: actions/upload-artifact@v4
      with:
        name: wasm-binaries
        path: |
          core.js
          core.wasm
